services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: coreline-searxng
    restart: "no"
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:Z
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_LIMITER=false
